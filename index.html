<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.M.A. - Simplified Mobile Apps | Software & Engineering</title>
    <!-- Fuente moderna desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #050b14;
            --card-bg: #0a192f;
            --card-bg-hover: #112240;
            --primary-neon: #00f0ff;
            --primary-neon-glow: rgba(0, 240, 255, 0.3);
            --border-neon: rgba(0, 240, 255, 0.4);
            --border-neon-hover: rgba(0, 240, 255, 0.9);
            --text-dark: #ffffff;
            --text-muted: #94a3b8;
            --radius: 12px;
            --shadow-hud: 0 0 15px rgba(0, 240, 255, 0.12);
            --shadow-hud-hover: 0 0 25px rgba(0, 240, 255, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            line-height: 1.6; 
            background-color: var(--bg-body); 
            color: var(--text-dark);
            padding: 32px 16px;
            min-height: 100vh;
        }

        .main-container {
            max-width: 1100px;
            margin: 0 auto;
        }
        
        /* HEADER HERO - HUD STYLE */
        header { 
            background: #081225;
            color: white; 
            padding: 48px 24px; 
            border-radius: var(--radius); 
            margin-bottom: 36px; 
            text-align: center;
            border: 1px solid var(--border-neon);
            box-shadow: var(--shadow-hud);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-neon), transparent);
        }

        .header-content {
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .logo-main { 
            width: 80px; 
            height: 80px; 
            border-radius: 16px; 
            margin-bottom: 16px;
            background-color: #0f223e; 
            padding: 6px;
            border: 1px solid var(--border-neon);
            box-shadow: 0 0 12px var(--primary-neon-glow);
        }

        header h1 { 
            font-size: 2.2em; 
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 8px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        header p.subtitle { 
            font-size: 1.05em; 
            color: var(--text-muted);
            margin-bottom: 20px;
            font-weight: 400;
        }

        .contact-pill {
            display: inline-block;
            background: #0d2137;
            border: 1px solid var(--border-neon);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.9em;
            color: var(--primary-neon);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
        }

        /* GRID SYSTEM */
        .apps-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        /* APP CARDS - HUD TECH STYLE */
        .app-card { 
            background: var(--card-bg); 
            padding: 24px; 
            border-radius: var(--radius); 
            border: 1px solid var(--border-neon);
            box-shadow: var(--shadow-hud); 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease-in-out;
            position: relative;
        }

        .app-card::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 10px; height: 10px;
            border-right: 2px solid var(--primary-neon);
            border-bottom: 2px solid var(--primary-neon);
        }

        .app-card:hover {
            transform: translateY(-5px);
            background: var(--card-bg-hover);
            box-shadow: var(--shadow-hud-hover);
            border-color: var(--border-neon-hover);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }
        
        .app-icon {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--border-neon);
            background: #050b14;
        }

        .app-title { 
            font-size: 1.25em; 
            font-weight: 600; 
            color: #ffffff; 
            line-height: 1.3;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }

        /* TECH TAGS */
        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 14px;
        }

        .tag {
            background-color: #132d4e;
            color: var(--primary-neon);
            font-size: 0.75rem;
            font-weight: 500;
            padding: 3px 9px;
            border-radius: 6px;
            border: 1px solid rgba(0, 240, 255, 0.3);
        }

        /* TECH DETAILS */
        .tech-details {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .tech-details strong {
            color: #e2e8f0;
            display: block;
            margin-bottom: 6px;
            font-size: 0.88rem;
            letter-spacing: 0.02em;
        }

        .tech-details ul {
            margin: 4px 0 0 0;
            padding-left: 18px;
        }

        .tech-details li {
            margin-bottom: 4px;
            color: #cbd5e1;
        }

        /* LINKS & BUTTONS */
        .app-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid rgba(0, 240, 255, 0.2);
        }

        a { 
            color: var(--primary-neon); 
            text-decoration: none; 
            font-weight: 500; 
            font-size: 0.88em; 
            transition: color 0.2s;
        }

        a:hover { 
            color: #ffffff;
            text-shadow: 0 0 8px var(--primary-neon);
            text-decoration: none; 
        }
